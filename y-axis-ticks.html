<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Y-Axis Tick Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<main class="container py-5">
  <h1 class="mb-4">Dynamic Y-Axis Tick Generator</h1>

  <form id="form" class="mb-3" novalidate>
    <div class="row g-3">
      <div class="col-md-3">
        <label for="minInput" class="form-label fw-semibold">Minimum data value</label>
        <input id="minInput" type="text" inputmode="decimal" class="form-control" placeholder="e.g. -500 000" value="0" />
      </div>
      <div class="col-md-3">
        <label for="maxInput" class="form-label fw-semibold">Maximum data value</label>
        <input id="maxInput" type="text" inputmode="decimal" class="form-control" placeholder="e.g. 3 450 000" />
      </div>
      <div class="col-md-3">
        <label for="tickCountInput" class="form-label fw-semibold">Desired tick count(s)</label>
        <input id="tickCountInput" type="text" class="form-control" value="9, 8, 7, 6, 5, 4, 3" aria-describedby="tickHelp" />
        <div id="tickHelp" class="form-text">Comma-separated, in order of preference (2–100)</div>
      </div>
      <div class="col-md-3">
        <label for="patternInput" class="form-label fw-semibold">Step pattern</label>
        <input id="patternInput" type="text" class="form-control" value="1, 2, 5" aria-describedby="patternHelp" />
        <div id="patternHelp" class="form-text">e.g. 1, 2, 5 · 1, 2.5, 5 · 1, 3, 6</div>
      </div>
      <div class="col-md-3">
        <label for="localeInput" class="form-label fw-semibold">Number format</label>
        <select id="localeInput" class="form-select">
          <option value="en-US">1,000,000.5 (en-US)</option>
          <option value="nb-NO">1 000 000,5 (nb-NO)</option>
          <option value="de-DE">1.000.000,5 (de-DE)</option>
          <option value="fr-FR">1 000 000,5 (fr-FR)</option>
        </select>
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <div class="form-check">
          <input id="logInput" type="checkbox" class="form-check-input" />
          <label for="logInput" class="form-check-label">Logarithmic scale</label>
        </div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Generate</button>
  </form>

  <section id="resultCard" class="card d-none shadow-sm" aria-labelledby="ticksTitle">
    <div class="card-body">
      <h2 id="ticksTitle" class="h5 card-title">Ticks</h2>
      <p id="ticksList" class="card-text mb-0" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section class="mt-5" aria-labelledby="examplesTitle">
    <h2 id="examplesTitle" class="h3 mb-4">Examples &amp; Test Cases</h2>
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr><th scope="col">Min</th><th scope="col">Max</th><th scope="col">Tick counts</th><th scope="col">Result</th></tr>
        </thead>
        <tbody id="examplesTable"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="y-axis-ticks.js"></script>
<script>
const $ = id => document.getElementById(id);
const $min = $('minInput'), $max = $('maxInput'), $counts = $('tickCountInput'),
      $pattern = $('patternInput'), $locale = $('localeInput'), $log = $('logInput'),
      $card = $('resultCard'), $out = $('ticksList');

// Accept "3 450 000", "3,450,000", "-0.5" — strip grouping, keep sign and dot.
const parseNumber = s => (s.trim() === '' ? NaN : Number(s.replace(/[,\s]/g, '')));
const fmt = v => v.toLocaleString($locale.value, { maximumFractionDigits: 10 });

function show(text) {
  $out.textContent = text;
  $card.classList.remove('d-none');
}

function performCalculation() {
  const min = parseNumber($min.value), max = parseNumber($max.value);
  if (!Number.isFinite(min) || !Number.isFinite(max)) return show('Please enter valid numbers for both min and max values.');
  if (min >= max) return show('Please ensure the minimum value is less than the maximum value.');

  try {
    const multipliers = $pattern.value.split(',').map(s => s.trim()).filter(Boolean).map(Number);
    const ticks = $log.checked
      ? buildLogTicks(min, max, { multipliers })
      : buildTicks(min, max, parseTickCounts($counts.value), { multipliers });
    show(ticks.map(fmt).join(' , '));
  } catch (e) {
    show(e.message);
  }
}

$('form').addEventListener('submit', e => { e.preventDefault(); performCalculation(); });
for (const el of [$min, $max, $counts, $pattern]) el.addEventListener('input', performCalculation);
for (const el of [$locale, $log]) el.addEventListener('change', () => { performCalculation(); renderExamples(); });

const EXAMPLES = [
  [0, 100], [0, 50], [0, 200], [0, 1000], [0, 2500], [0, 5000],
  [0, 100000], [0, 500000], [0, 1000000], [0, 5000000], [0, 50000000],
  [-100, 100], [-500, 0], [-1000, 500],
  [0, 1.5], [0, 0.5], [-2.5, 2.5], [0.1, 0.7],
  [0, 1000, '7, 5, 3'], [0, 500, '10'], [0, 5e10]
];

function renderExamples() {
  const tbody = $('examplesTable');
  tbody.replaceChildren(...EXAMPLES.map(([min, max, counts = '9, 8, 7, 6, 5, 4, 3']) => {
    const row = document.createElement('tr');
    const ticks = buildTicks(min, max, parseTickCounts(counts)).map(fmt).join(' , ');
    for (const text of [fmt(min), fmt(max), counts, ticks]) {
      const td = document.createElement('td');
      td.textContent = text;
      row.appendChild(td);
    }
    row.lastChild.style.fontFamily = 'var(--bs-font-monospace)';
    return row;
  }));
}

renderExamples();
</script>
</body>
</html>
